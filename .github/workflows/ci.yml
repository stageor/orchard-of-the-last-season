name: CI

# Required checks for every pull request and every push to main.
#
# There are deliberately no paths/paths-ignore filters on the pull_request or
# push triggers. A path filter that misses an extension or a deleted file can
# silently skip Unity validation. The `changes` job classifies the diff with an
# allow-list, and the `Required checks` job fails closed on every unexpected
# skip, failure or cancellation.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      unity: ${{ steps.classify.outputs.unity }}
      build: ${{ steps.classify.outputs.build }}
      protected: ${{ steps.classify.outputs.protected }}
      fork: ${{ steps.classify.outputs.fork }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          set -euo pipefail
          echo "fork=$IS_FORK" >> "$GITHUB_OUTPUT"
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit; forcing full Unity validation."
            {
              echo "docs_only=false"
              echo "unity=true"
              echo "build=true"
              echo "protected=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/detect_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  repository-health:
    name: Repository health
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install CI dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt

      - name: Compile Python tooling
        run: python3 -m py_compile scripts/*.py tests/ci/*.py

      - name: Run CI tooling tests
        run: python3 -m unittest discover -s tests/ci -t . -v

      - name: Validate repository invariants
        run: python3 scripts/validate_repository.py --github-summary "$GITHUB_STEP_SUMMARY"

  csharp-analysis:
    name: C# contract analysis
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Analyse C# contract
        run: python3 scripts/csharp_analysis.py --github-summary "$GITHUB_STEP_SUMMARY"

  unity-editmode:
    name: Unity EditMode tests
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.fork != 'true'
    uses: ./.github/workflows/unity-tests.yml
    with:
      mode: editmode
      minTests: 120
      regression: false
      retentionDays: 14
    secrets: inherit

  unity-playmode:
    name: Unity PlayMode tests
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.fork != 'true'
    uses: ./.github/workflows/unity-tests.yml
    with:
      mode: playmode
      minTests: 1
      regression: false
      retentionDays: 14
    secrets: inherit

  build-windows:
    name: Build Windows x64
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.fork != 'true'
    uses: ./.github/workflows/unity-build.yml
    with:
      target: StandaloneWindows64
      retentionDays: 14
    secrets: inherit

  build-webgl:
    name: Build WebGL
    needs: changes
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.fork != 'true'
    uses: ./.github/workflows/unity-build.yml
    with:
      target: WebGL
      retentionDays: 14
    secrets: inherit

  required-checks:
    name: Required checks
    if: always()
    needs:
      - changes
      - repository-health
      - csharp-analysis
      - unity-editmode
      - unity-playmode
      - build-windows
      - build-webgl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Aggregate required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only || 'false' }}
          IS_FORK: ${{ needs.changes.outputs.fork || 'false' }}
        run: |
          set -euo pipefail
          python3 scripts/ci_gate.py \
            --docs-only "$DOCS_ONLY" \
            --fork "$IS_FORK" \
            --out-json required-checks.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload required-checks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-checks-${{ github.run_id }}
          path: required-checks.json
          if-no-files-found: warn
          retention-days: 14
